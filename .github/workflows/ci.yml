name: CI

on:
  push:
    # Every branch, not only main: a branch push is the whole
    # verification loop here — Windows only runs in CI, so fixes for it
    # must be provable before they reach main, without needing a pull
    # request as the trigger. The branch filter keeps tag pushes out;
    # those already run these checks through the release workflow's
    # call below.
    branches: ["**"]
  pull_request:
  # Callable so the release workflow gates on these exact checks rather
  # than a second copy of them that can drift.
  workflow_call:

# Iterating on a branch means force-pushing over runs that no longer
# matter; cancel those instead of finishing them. Runs on main are
# never canceled — each is the record that a pushed state was green.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: vocabulary boundary check
        run: ./scripts/check_vocabulary.sh
      - name: tests with coverage gate
        run: ./scripts/check_coverage.sh

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - name: goreleaser config check
        run: goreleaser check
      - name: snapshot build
        run: goreleaser build --snapshot --clean

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
