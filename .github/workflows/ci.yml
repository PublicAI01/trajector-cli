name: CI

on:
  push:
    # main only: a push there is the record that the landed state was
    # green, and the branch filter keeps tag pushes out — those run
    # these checks through the release workflow's call below. Branches
    # used to trigger on push too, but a branch with an open pull
    # request then ran everything twice and the concurrency group
    # cancelled one twin, leaving a failed run on every pull-request
    # push. To verify a branch before it reaches main — a Windows fix,
    # say — open a pull request for it, a draft one if it is not ready.
    # The branch ruleset on main accepts all-checks only from push and
    # pull_request runs; a manual run on a branch does not clear its
    # commit for main.
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable so the release workflow gates on these exact checks rather
  # than a second copy of them that can drift.
  workflow_call:

# Iterating on a branch means force-pushing over runs that no longer
# matter; cancel those instead of finishing them. Runs on main are
# never canceled — each is the record that a pushed state was green.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # install.sh is a shipped artifact and the first thing a new user
      # runs, so a parse error in it is a broken release. What the
      # script does is covered by internal/installscript, which runs it
      # end to end; this only rules out the failure that would keep
      # those tests from reaching any of it.
      - name: shell script syntax
        run: |
          for script in install.sh scripts/*.sh; do
            if head -n 1 "$script" | grep -q bash; then
              bash -n "$script"
            else
              sh -n "$script"
            fi
          done
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: vocabulary boundary check
        run: ./scripts/check_vocabulary.sh
      - name: tests with coverage gate
        run: ./scripts/check_coverage.sh

  release-config:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Built as the release job builds, without a cache.
          cache: false
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          install-only: true
      - name: goreleaser config check
        run: goreleaser check
      - name: snapshot build
        run: goreleaser build --snapshot --clean

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...

  # Docker runs the pinned tool images, and only the Ubuntu runner has it.
  workflow-lint:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check_static.sh zizmor
      - name: actionlint
        run: ./scripts/check_static.sh actionlint

  # The one check the main branch ruleset requires. Every other job must
  # be listed in `needs`; a job left out does not gate main. `always()`
  # keeps this job from being skipped when a dependency fails or is
  # cancelled: GitHub counts a skipped required check as passed. A dependency that is skipped is a
  # failure too; a job that is skipped on purpose must be named here as
  # allowed to skip.
  all-checks:
    if: always()
    needs: [checks, release-config, build-and-test, workflow-lint]
    runs-on: ubuntu-26.04
    steps:
      - name: every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "$failed" >&2
            exit 1
          fi
