name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # A tag can be pushed at a commit CI never ran on. Nothing is published
  # until the same checks that guard main have passed on the tagged tree.
  ci:
    permissions:
      contents: read
    # A local reusable workflow already runs at the caller's commit, so
    # `$/` would change nothing here, and actionlint 1.7.12 rejects it.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  release:
    needs: ci
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Every agreement published before the one that carries the Updates
      # section is dated 2026-09-29 or earlier. A release still naming that
      # day as UpdatesSince would let those acceptances cover the
      # automatic upgrade check.
      - name: Refuse an UpdatesSince that predates the Updates section
        run: |
          if grep -q 'UpdatesSince = "2026-09-29"' internal/consent/agreement.go; then
            echo "::error file=internal/consent/agreement.go::UpdatesSince still names 2026-09-29, an agreement without the Updates section; set it to this release's AgreementVersion"
            exit 1
          fi
      # No build cache in the job that publishes: a cache written by any
      # other run could put its objects into the release binaries.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      # The attestation is what lets a user prove a downloaded archive was
      # built by this workflow from this repository's source. The Homebrew
      # tap is written after the release is published, so a tap that
      # cannot be written fails the step above with the archives already
      # public: they are attested whenever the build produced them.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !cancelled() && hashFiles('dist/trajector_checksums.txt') != '' }}
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/trajector_checksums.txt
