name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # A tag can be pushed at a commit CI never ran on. Nothing is published
  # until the same checks that guard main have passed on the tagged tree.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The attestation is what lets a user prove a downloaded archive was
      # built by this workflow from this repository's source.
      - uses: actions/attest-build-provenance@v4
        with:
          # No dist/*.zip: Windows is not published (see .goreleaser.yaml),
          # and a pattern matching nothing fails this step. Restore it
          # together with the platform.
          subject-path: |
            dist/*.tar.gz
            dist/trajector_checksums.txt
