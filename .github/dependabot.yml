version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gomod:
        patterns: ["*"]

  # The govulncheck version. Go marks a tool module indirect, so the
  # tool is allowed by name; its own dependencies move only as far as
  # the new version requires.
  - package-ecosystem: gomod
    directory: /tools/govulncheck
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    allow:
      - dependency-name: golang.org/x/vuln
    groups:
      govulncheck:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # The tool images that scripts/check_static.sh runs. Every new
  # tools/<tool>/ directory is added here.
  - package-ecosystem: docker
    directories:
      - /tools/actionlint
      - /tools/zizmor
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns: ["*"]
