# Release pipeline configuration. Builds are reproducible on purpose
# (-trimpath, commit timestamps): the provenance attestation is only as
# convincing as the build is repeatable.
version: 2

project_name: trajector

builds:
  - main: ./cmd/trajector
    binary: trajector
    env:
      - CGO_ENABLED=0
    # Windows is not published. The code still builds and is tested for
    # it — CI compiles every platform, and the Windows-specific paths
    # have their own tests — but the end-to-end pass against the live
    # service has only been run on macOS and Linux. An archive on the
    # releases page reads as a supported platform, and this one is not
    # one yet. Add `windows` back here when that pass is done; the zip
    # override below is kept ready for it.
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/PublicAI01/trajector-cli/internal/cli.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - name_template: "trajector_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    # Inert while windows is out of the build list above, and kept so
    # restoring that platform is one word rather than two decisions.
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES
      - README.md
      - PRIVACY.md

# The README's verification instructions name this file; keep them in sync.
checksum:
  name_template: trajector_checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  sort: asc

# The Homebrew cask is published to PublicAI01/homebrew-tap on every
# release. It is written over SSH with a deploy key that may write to
# that one repository and nothing else, handed to the release workflow
# as HOMEBREW_TAP_DEPLOY_KEY. skip_upload is left at its default: `auto`
# would skip every 0.x release, since each one is a pre-release (see
# `release` below), and the tap would never be written.
homebrew_casks:
  - name: trajector
    binaries: [trajector]
    homepage: https://github.com/PublicAI01/trajector-cli
    description: Turn your own Claude Code sessions into compensated data contributions
    repository:
      owner: PublicAI01
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:PublicAI01/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    # Releases are not code-signed yet, and Homebrew's download carries
    # the quarantine mark a browser download would. Without this the
    # binary is refused by Gatekeeper on first run. Remove it once the
    # macOS build is signed and notarized.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/trajector"]
          end

# Stated explicitly so validation does not depend on a configured git
# remote; this repository builds locally long before it is pushed.
release:
  github:
    owner: PublicAI01
    name: trajector-cli
  # Every 0.x tag is published as a pre-release: before a stable major,
  # no release should read as the recommended general-use download.
  # Switch to `auto` when a stable major ships.
  prerelease: true
